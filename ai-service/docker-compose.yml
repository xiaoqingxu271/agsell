# ============================================================
# agsell AI 智能客服 · docker-compose（阶段五）
# 启动：docker compose up -d --build
# 依赖：Java 主系统（8080）需已运行，容器通过 host.docker.internal 访问
# ============================================================
services:
  ai-service:
    build: .
    container_name: agsell-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内访问宿主机 Java 主系统（Windows/Mac Docker Desktop 支持）
      - JAVA_BASE_URL=http://host.docker.internal:8080/api
      # 会话记忆持久化到容器卷（跨容器重启可恢复）
      - SQLITE_PATH=/app/data/checkpoints.db
    volumes:
      - ai-data:/app/data
    restart: unless-stopped
    # 等待宿主 Java 服务就绪（最多 60s）后启动
    depends_on:
      - redis

  # 可选：Redis 8+（内置 RediSearch），用于 MEMORY_BACKEND=redis
  # 本地 Windows Redis 5 无 RediSearch 时，将 .env 的 MEMORY_BACKEND 保持 sqlite 即可
  redis:
    image: redis/redis-stack-server:latest
    container_name: agsell-ai-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  ai-data:
  redis-data:
