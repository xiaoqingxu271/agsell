server:
  port: ${server.port}
  servlet:
    context-path: ${server.context-path}

spring:
  application:
    name: agsell
  profiles:
    active: ${ACTIVE_PROFILE:local}
  # 数据库配置
  datasource:
    url: jdbc:mysql://${db.host}:${db.port}/agsell?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${db.password}
    username: ${db.username}
  data:
    # Redis配置
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      database: ${redis.database}
      timeout: ${redis.timeout}

# springdoc-openapi项目配置
# 接口文档默认开启（本地开发）；生产/公网部署时通过环境变量关闭
springdoc:
  api-docs.enabled: ${SPRINGDOC_ENABLED:true}
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lichun.agsell.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  # 生产模式：屏蔽文档资源（docker-compose 部署置 true）
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn

# mybatis-plus配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名(deleted为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0

# jwt配置
jwt:
  expiration: ${jwt.expiration} # 过期时间，单位毫秒
  secret: ${jwt.secret} # 64字节的密钥
  token-header: ${jwt.token-header} # 令牌头名称
  token-prefix: ${jwt.token-prefix} # 令牌前缀

# 微信小程序配置
wechat:
  miniapp:
    appid: ${wechat.miniapp.appid}
    secret: ${wechat.miniapp.secret}
    code2session_url: https://api.weixin.qq.com/sns/jscode2session

# 短信验证码配置
sms:
  # 是否把验证码随 /api/sms/send 响应返回前端（短信通道未接入时的开发/演示便利）
  # 默认关闭，仅本地 profile 打开；生产环境切勿设置 SMS_ECHO_CODE=true
  echo-code: ${SMS_ECHO_CODE:false}

# 日志配置
logging:
  level:
    root: INFO
    

# 订单配置
order:
  timeout-minutes: 30 # 待付款订单超时分钟数，超过自动取消

# 溯源配置
trace:
  base-url: ${TRACE_BASE_URL:http://localhost:8080/api} # 溯源 H5 页面域名（二维码内容前缀），可用环境变量 TRACE_BASE_URL 覆盖

# AI 客服服务配置（阶段三）
ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000} # Python AI 服务地址
  # 必须由环境变量 AI_INTERNAL_KEY 注入，无默认值（缺失则启动失败，避免静默使用公开密钥）
  internal-key: ${AI_INTERNAL_KEY}
  # AI 端点固定窗口限流（按登录用户，游客按客户端 IP）：Agnes 免费额度与 Python 单实例全站共享，
  # 一个循环脚本即可在几十秒内烧光额度并拖垮演示，故在网关层设硬上限，超额不再转发。
  # Redis 不可用时放行（限流是保护层，不阻断业务）；阈值可按演示需要上调，无需改代码。
  rate-limit:
    window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60} # 窗口长度
    chat-limit: ${AI_RATE_LIMIT_CHAT:20} # 对话（含流式）每主体每窗口次数
    feed-limit: ${AI_RATE_LIMIT_FEED:60} # 首页推荐 feed（下拉刷新会连续触发，放宽）
    view-limit: ${AI_RATE_LIMIT_VIEW:120} # 浏览足迹上报

