services:
  mysql:
    image: mysql:8.4
    container_name: agsell-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agsell
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/sql:ro
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agsell-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
    container_name: agsell-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACTIVE_PROFILE: prod
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /api
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      REDIS_TIMEOUT: 60s
      JWT_EXPIRATION: 86400000
      JWT_SECRET: ${JWT_SECRET}
      JWT_TOKEN_HEADER: Authorization
      JWT_TOKEN_PREFIX: Bearer
      WECHAT_MINIAPP_APPID: ${WECHAT_MINIAPP_APPID}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME}
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./agsell-frontend
    container_name: agsell-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
    container_name: agsell-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      # 同一 compose 网络内直接用服务名访问
      - JAVA_BASE_URL=http://backend:8080/api
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/agsell?charset=utf8mb4
      - SQLITE_PATH=/app/data/checkpoints.db
    volumes:
      - ai-data:/app/data
    depends_on:
      - mysql
      - backend

volumes:
  mysql-data:
  redis-data:
  ai-data:
